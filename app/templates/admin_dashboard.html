<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoCampus - Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" alt="GoCampus">
            GoCampus <span style="font-size: 0.8em; opacity: 0.7; margin-left: 5px;">| ADMIN</span>
        </a>
        <ul class="nav-links">
            <li><a href="/">Retour au site</a></li>
            <li><a href="#" onclick="handleLogout(event)">Déconnexion</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Dashboard Administrateur</h1>
            <p id="adminName">Chargement...</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('users')">Utilisateurs</button>
            <button class="tab-btn" onclick="switchTab('rides')">Trajets</button>
            <button class="tab-btn" onclick="switchTab('reservations')">Réservations</button>
        </div>

        <!-- USERS TAB -->
        <div id="users" class="tab-content active">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>

        <!-- RIDES TAB -->
        <div id="rides" class="tab-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Conducteur</th>
                        <th>De > Vers</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ridesTableBody"></tbody>
            </table>
        </div>

        <!-- RESERVATIONS TAB -->
        <div id="reservations" class="tab-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Passager</th>
                        <th>Trajet ID</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/popup.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
