{% extends "base.html" %}

{% block title %}GoCampus - Inscription{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/inscription.css">
{% endblock %}

{% block content %}
    <!-- Formulaire Inscription -->
    <div class="main-content">
        <div class="login-card">

            <div class="login-header-wrapper">
                <img src="/static/images/logo.svg" alt="Logo" class="login-logo-img" onerror="this.style.display='none'">
                <h1 class="login-logo-text">GoCampus</h1>
            </div>

            <h2 class="login-subtitle">Créer un compte</h2>

            <form id="registerForm">

                <!-- Nom et Prénom -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nom</label>
                        <div class="input-wrapper">
                            <input type="text" id="name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prénom</label>
                        <div class="input-wrapper">
                            <input type="text" id="surname" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required>
                        <img src="/static/images/oeil 1.svg" id="togglePassword" class="eye-icon" alt="Voir">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Téléphone</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" required>
                    </div>
                </div>

                <!-- Message d'erreur -->
                <div id="errorMessage" style="color: red; margin-bottom: 10px; display: none;"></div>

                <button type="submit" class="btn-submit">S'inscrire</button>
            </form>

            <div class="login-footer">
                Vous avez déjà un compte ? <a href="/connexion">Se connecter</a>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script src="/static/js/script.js"></script>
{% endblock %}
